name: PR review bot

# Runs only when someone comments on an issue or PR.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Run only when:
    # - the comment is on a PR (not a plain issue)
    # - the comment is "/review" or starts with "/review " (for options such
    #   as --dry-run or --dummy); "/reviewer" doesn't count
    # - the commenter is listed in the REVIEW_BOT_USERS repo variable,
    #   a JSON array of GitHub usernames, e.g. ["alice","bob"]
    # Otherwise the job is skipped and uses no runner minutes.
    # If the variable is unset, nobody can trigger the bot.
    if: >
      github.event.issue.pull_request &&
      (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ')) &&
      contains(fromJSON(vars.REVIEW_BOT_USERS || '[]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    concurrency:
      group: pr-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      # Checks out the default branch (the bot's code), not the PR's code.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      # Reads the PR through the GitHub API (never runs its code), asks
      # Claude to judge it against bot/criteria.json, and renders the comment.
      # The comment text goes in through an environment variable and is only
      # parsed by the script, so it can never run as a shell command.
      - name: Run review script
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REQUESTED_BY: ${{ github.event.comment.user.login }}
          REVIEW_COMMAND: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python bot/review.py --report-out report.json --prompt-out prompt.txt > comment.md

      # Edits the bot's earlier comment on this PR if there is one, so a
      # re-review updates it instead of adding another comment.
      - name: Post comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: python bot/post_comment.py --body-file comment.md

      # Keeps the report JSON (full review) or the prompt (dry run) with the
      # run. The report moves to the bot-reports branch later.
      - name: Upload report and prompt
        uses: actions/upload-artifact@v7
        with:
          name: review-pr-${{ github.event.issue.number }}
          path: |
            report.json
            prompt.txt
          if-no-files-found: ignore

      # Puts a failure note on top of the bot's comment and keeps the last
      # review below it. If Python itself can't run (for example, setup
      # failed), posts a plain comment instead.
      - name: Post failure notice
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          python bot/post_comment.py --failed ||
          gh pr comment "$PR_NUMBER" --body "🤖 The review bot failed. See the [run log]($RUN_URL)."
